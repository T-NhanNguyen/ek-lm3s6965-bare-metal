# EK-LM3S6965 — TI/Luminary Stellaris LM3S6965 Ethernet Evaluation Board
#
# OpenOCD ships no board config for this board: the target/ directory contains
# only the generic `stellaris.cfg`, and the interface is the on-board Luminary
# ICDI probe. This file combines the two.
#
# Usage:
#   openocd -f /path/to/openocd/board/ek-lm3s6965.cfg
#
# Self-contained: adds this repository's openocd/ directory to the script search
# path so that `find interface/...` resolves regardless of the current directory.
add_script_search_dir [file dirname [file dirname [info script]]]

# Names the TAP and flash bank (lm3s6965.flash) and the target (lm3s6965.cpu).
set CHIPNAME lm3s6965

# The LM3S6965 has 64 KB of SRAM, so we can afford a larger algorithm
# working area than the 2 KB default. It lives at the base of SRAM and is
# not backed up across the flash operation.
set WORKAREASIZE 0x1000

# On-board debug probe. NOTE: this board does NOT use OpenOCD's shipped
# interface/ftdi/luminary-icdi.cfg -- that file matches 0x0403:0xbcda with the
# product string "Luminary Micro ICDI Board" (the LM3S9B9x kit's ICDI). This
# board enumerates as 0x0403:0xbcd9 "Stellaris Evaluation Board", so it needs
# its own interface config.
source [find interface/luminary-icdi-ek-lm3s6965.cfg]

# Transport. SWD is the default, for two reasons.
#
#   1. It is required for the SWO console. Only in SWD mode does the shared TDO
#      pin carry SWO instead of JTAG data, and the board's CPLD taps that pin to
#      feed the ICDI's virtual console.
#   2. It costs nothing. SWD programs and debugs the chip identically, verified
#      on this board with `program ... verify reset` reporting ** Verified OK **,
#      and a JTAG session still works with the trace unit fully enabled.
#
# Override for a JTAG session with:
#   openocd -c "set LM3S6965_TRANSPORT jtag" -f openocd/board/ek-lm3s6965.cfg
if { ![info exists LM3S6965_TRANSPORT] } {
    set LM3S6965_TRANSPORT swd
}
transport select ${LM3S6965_TRANSPORT}

# Generic Stellaris family target. Detects the device class at run time and
# selects NVIC SYSRESETREQ for Fury-class parts (the LM3S6965 is Fury).
# Declares the flash bank as `stellaris` with autodetected geometry.
source [find target/stellaris.cfg]
