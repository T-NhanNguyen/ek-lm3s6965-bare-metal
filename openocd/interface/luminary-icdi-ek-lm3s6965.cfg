# EK-LM3S6965 on-board In-Circuit Debug Interface (ICDI)
#
# Why this file exists instead of sourcing OpenOCD's shipped
# interface/ftdi/luminary-icdi.cfg:
#
#   Shipped config expects : VID:PID 0x0403:0xbcda, "Luminary Micro ICDI Board"
#   This board enumerates as: VID:PID 0x0403:0xbcd9, "Stellaris Evaluation Board"
#
# The shipped file targets the LM3S9B9x evaluation kit's ICDI. The EK-LM3S6965's
# on-board ICDI is the same FTDI FT2232 design (identical pin layout below) but
# reports a different product ID and product string, so matching fails and
# OpenOCD reports "no device found".
#
# Observed on this host:
#   Product : Stellaris Evaluation Board
#   VID     : 0x0403   (FTDI)
#   PID     : 0xBCD9
#
# The probe's own USB serial number is deliberately not recorded here. It is
# device-identifying, it differs per board, and the match above does not rely on
# it -- so this config works for any EK-LM3S6965.

adapter driver ftdi

ftdi device_desc "Stellaris Evaluation Board"
ftdi vid_pid 0x0403 0xbcd9

# FT2232 pin layout. Identical to the shipped luminary-icdi.cfg, because the
# board wiring is the same FT2232 design.
ftdi layout_init 0x00a8 0x00eb
ftdi layout_signal nSRST -noe 0x0020
ftdi layout_signal SWD_EN -ndata 0x0080
ftdi layout_signal SWDIO_OE -data 0x0008
